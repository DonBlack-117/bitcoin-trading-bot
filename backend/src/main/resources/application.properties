spring.application.name=trading-bot
# Credenciales locales fuera de git (application-local.properties está en .gitignore)
spring.config.import=optional:classpath:application-local.properties
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/tradingbot}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
bitso.api.url=https://api.bitso.com/v3
# Espejo de datos públicos de Binance: api.binance.com responde 451 desde servidores en EE. UU.
binance.api.url=${BINANCE_API_URL:https://data-api.binance.vision}
# Cada cuánto el bot recalcula la señal y procesa operaciones
bot.signal.interval-ms=${BOT_SIGNAL_INTERVAL_MS:30000}
cmc.api.url=https://pro-api.coinmarketcap.com
cmc.api.key=${CMC_API_KEY:}
spring.cache.caffeine.spec=expireAfterWrite=300s
spring.cache.cache-names=globalMarket,cryptoList
