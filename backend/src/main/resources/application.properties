spring.application.name=trading-bot
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/tradingbot}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
bitso.api.url=https://api.bitso.com/v3
cmc.api.url=https://pro-api.coinmarketcap.com
cmc.api.key=${CMC_API_KEY:}
spring.cache.caffeine.spec=expireAfterWrite=300s
spring.cache.cache-names=globalMarket,cryptoList
