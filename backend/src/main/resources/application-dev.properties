# ── Development overrides ────────────────────────────────────────────────────
# Las tablas las crea Flyway también en desarrollo; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Local DB credentials (override base config as needed)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/tradingbot}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Local CMC key
cmc.api.key=${CMC_API_KEY:}
