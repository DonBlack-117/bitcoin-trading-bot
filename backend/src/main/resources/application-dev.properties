# ── Development overrides ────────────────────────────────────────────────────
# Allows Hibernate to create/alter tables automatically during local development.
# DO NOT use in production — use 'validate' there (see application.properties).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local DB credentials (override base config as needed)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/tradingbot}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Local CMC key
cmc.api.key=${CMC_API_KEY:your-key-here}
